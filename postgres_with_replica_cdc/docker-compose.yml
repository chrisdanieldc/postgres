services:
  postgres-primary:
    image: postgres:16
    container_name: postgres-primary
    restart: unless-stopped
    env_file:
      - .env.postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata-primary:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdc -d ccdc"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres-replica:
    image: postgres:16
    container_name: postgres-replica
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    env_file:
      - .env.postgres
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres-primary
      REPLICA_USER: replicator
      REPLICA_SLOT: replica_slot_1
    ports:
      - "5435:5432"
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdc"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    env_file:
      - .env.pgadmin
    ports:
      - "5051:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy

volumes:
  pgdata-primary:
  pgdata-replica:
  pgadmin-data:
